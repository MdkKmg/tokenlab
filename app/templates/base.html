<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}tokenlab{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
  <link rel="apple-touch-icon" href="/static/favicon-192.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2e37;
      --text: #e6e6e6;
      --muted: #9aa1ac;
      --accent: #5aa9ff;
      --ok: #4caf7d;
      --err: #e0654a;
      --warn: #e0a94a;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem 1.25rem 4rem;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.05rem; margin: 2rem 0 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
    .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; }
    table.kv { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.kv td { padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.kv td:first-child { color: var(--muted); width: 220px; font-family: var(--mono); }
    table.kv td:last-child { font-family: var(--mono); word-break: break-all; }
    .badge { display: inline-block; padding: 0.1rem 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge.on { background: rgba(76,175,125,0.15); color: var(--ok); }
    .badge.off { background: rgba(154,161,172,0.15); color: var(--muted); }
    .badge.warn { background: rgba(224,101,74,0.15); color: var(--err); }
    details.info { border-color: rgba(90,169,255,0.3); margin-bottom: 0.75rem; }
    details.info > summary { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; font-size: 0.9rem; }
    .info-body { padding: 0 1.1rem 1.1rem; font-size: 0.88rem; color: var(--text); }
    .info-body p { margin: 0.6rem 0; }
    .info-body ul, .info-body ol { margin: 0.5rem 0; padding-left: 1.4rem; }
    .info-body li { margin: 0.35rem 0; }
    .info-body code { font-family: var(--mono); background: #0b0e13; padding: 0.05rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
    .checklist { font-size: 0.88rem; }
    .checklist h3 { font-size: 0.95rem; margin: 1.1rem 0 0.4rem; }
    .checklist h3:first-child { margin-top: 0; }
    .checklist p { margin: 0.6rem 0 0.3rem; }
    .checklist ul { list-style: none; margin: 0.3rem 0; padding-left: 0; }
    .checklist li { margin: 0.3rem 0; padding-left: 1.6rem; position: relative; }
    .checklist li::before { content: "•"; position: absolute; left: 0.5rem; color: var(--muted); }
    .checklist ul.refs li::before { content: "↗"; left: 0.3rem; }
    .src {
      display: inline-block; margin-left: 0.3rem; padding: 0 0.45rem; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted); font-size: 0.72rem; text-decoration: none;
      white-space: nowrap; vertical-align: 0.05em;
    }
    .src:hover { color: var(--accent); border-color: var(--accent); }
    .checks h3 { font-size: 0.95rem; margin: 1.1rem 0 0.4rem; }
    .checks table.kv td:first-child { width: 340px; font-family: inherit; color: var(--text); }
    .checks table.kv td:last-child { color: var(--muted); font-size: 0.82rem; }
    .check-icon { display: inline-block; width: 1.2em; font-weight: 700; }
    .check-ok .check-icon { color: var(--ok); }
    .check-warn .check-icon { color: var(--warn); }
    .check-fail .check-icon { color: var(--err); }
    .check-info .check-icon { color: var(--accent); }
    .check-na .check-icon, .check-na td:first-child { color: var(--muted); }
    .checklist code { font-family: var(--mono); background: #0b0e13; padding: 0.05rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
    details.box { background: var(--panel); border-radius: 10px; margin-bottom: 1.25rem; }
    details.box > summary { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; font-size: 0.95rem; padding: 0.9rem 1.5rem; }
    details.box > summary::before { content: "▸"; display: inline-block; width: 1em; color: var(--muted); transition: transform 0.15s; }
    details.box[open] > summary::before { transform: rotate(90deg); }
    .box-summary { color: var(--muted); font-weight: 400; font-family: var(--mono); font-size: 0.82rem; }
    .box-body { padding: 0 1.5rem 1.25rem; }
    .match-ok { color: var(--ok); font-weight: 600; }
    .match-warn { color: var(--err); font-weight: 600; }
    .field-label { display: block; font-size: 0.85rem; margin-top: 0.7rem; }
    .field-input {
      display: block; width: 100%; margin-top: 0.35rem; padding: 0.55rem 0.7rem;
      background: #0b0e13; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: var(--mono); font-size: 0.85rem;
    }
    .field-checkbox { display: flex; align-items: flex-start; gap: 0.55rem; margin-top: 0.7rem; font-size: 0.85rem; }
    .field-checkbox input { margin-top: 0.2rem; }
    .field-hint { color: var(--muted); font-size: 0.82rem; margin: 0.3rem 0 0; }
    button.btn { border: none; font: inherit; cursor: pointer; }
    .btn { display: inline-block; background: var(--accent); color: #0b0e13; font-weight: 600; text-decoration: none; padding: 0.65rem 1.4rem; border-radius: 8px; font-size: 0.95rem; }
    .btn:hover { filter: brightness(1.08); }
    .btn-secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-secondary:hover { background: rgba(90,169,255,0.1); filter: none; }
    pre { background: #0b0e13; border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem 1rem; overflow-x: auto; font-family: var(--mono); font-size: 0.82rem; }
    details { background: #0b0e13; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.6rem; }
    summary { cursor: pointer; padding: 0.65rem 1rem; font-family: var(--mono); font-size: 0.85rem; list-style: none; display: flex; gap: 0.6rem; align-items: center; }
    summary::-webkit-details-marker { display: none; }
    summary .step { color: var(--text); font-weight: 600; font-family: system-ui, sans-serif; }
    summary .method { color: var(--accent); }
    summary .status { margin-left: auto; font-weight: 700; }
    .btn-copy {
      background: transparent; color: var(--accent);
      border: 1px solid var(--border); border-radius: 6px; padding: 0.25rem 0.6rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 0.78rem;
      font-weight: 600; cursor: pointer;
    }
    .btn-copy:hover { border-color: var(--accent); background: rgba(90,169,255,0.1); }
    summary .status.s2 { color: var(--ok); }
    summary .status.s4, summary .status.s5 { color: var(--err); }
    details.section { background: none; border: none; border-radius: 0; margin: 0; }
    details.section > summary { padding: 0; display: block; }
    details.section > summary > h2::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--muted); transition: transform 0.15s; }
    details.section[open] > summary > h2::before { transform: rotate(90deg); }
    details.section > summary > h2 .count { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
    details .body { padding: 0 1rem 1rem; }
    details .body h4 { margin: 0.8rem 0 0.3rem; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .banner { padding: 0.9rem 1.1rem; border-radius: 8px; font-weight: 600; margin-bottom: 1.5rem; }
    .banner.ok { background: rgba(76,175,125,0.12); color: var(--ok); border: 1px solid rgba(76,175,125,0.35); }
    .banner.err { background: rgba(224,101,74,0.12); color: var(--err); border: 1px solid rgba(224,101,74,0.35); }
    .banner.warn { background: rgba(224,169,74,0.12); color: var(--warn); border: 1px solid rgba(224,169,74,0.35); }
    a { color: var(--accent); }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 3rem; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
    <footer>tokenlab &mdash; outil de test de configurations Keycloak (standard flow)</footer>
  </main>
</body>
</html>
